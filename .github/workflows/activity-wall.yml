name: Refresh activity wall

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: activity-wall
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Build from the GitHub contribution calendar
        run: |
          for attempt in 1 2 3; do
            if node tools/build-activity.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish updated activity assets
        shell: bash
        run: |
          git add README.md data/public-calendar.json assets/activity-*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh the activity wall'
          git pull --rebase origin main
          git push


