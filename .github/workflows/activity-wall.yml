name: Refresh activity wall

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'
  push:
    branches: [main]
    paths:
      - tools/build-activity.mjs
      - .github/workflows/activity-wall.yml

permissions:
  contents: write

concurrency:
  group: activity-wall
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build from the GitHub contribution calendar
        run: node tools/build-activity.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish updated activity assets
        shell: bash
        run: |
          git add data/public-calendar.json assets/activity-*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh the activity wall'
          git push

